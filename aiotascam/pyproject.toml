[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiotascam"
version = "0.1.0"
description = "Async Python client for the Tascam BD-MP4K Blu-ray player (RS-232C/Ethernet protocol)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "HuisAutomatisering", email = "yorrick@indyvideo.nl" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
]

[project.urls]
Homepage = "https://github.com/HuisAutomatisering/aiotascam"
Issues = "https://github.com/HuisAutomatisering/aiotascam/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aiotascam = ["py.typed"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
